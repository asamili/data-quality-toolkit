[build-system]
requires = ["setuptools>=71.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-toolkit"
version = "2.10.0"
description = "CSV-first data quality toolkit for BI and reporting workflows: profile, assess, export, and compare run-to-run quality trends."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Data Team" }]
keywords = ["data-quality", "power-bi", "data-profiling", "data-pipeline", "business-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3.12",
]

# Core dependencies for Phase 1 & 2
dependencies = [
    # Data Processing
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",

    # Configuration & Models
    "pydantic>=2.6,<2.10",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",

    # CLI & UI
    "rich>=13.0.0",

    # Templates
    "jinja2>=3.1.0",

    # Utilities
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=26.3.1",
    "isort>=5.12.0",
    "pre-commit>=3.3.0",
    "pip-audit>=2.7.0",  # Dependency CVE scanning
    "ipykernel>=6.25.0",  # For notebooks
    "import-linter>=2.1",  # Architecture boundary enforcement
]

viz = [
    "matplotlib>=3.7.0",  # Drift PNG plots: dqt drift-history plot
]

test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

powerbi = [
    "openpyxl>=3.1.0",  # Excel (.xlsx) export: dqt drift-history export-xlsx
    "xlsxwriter>=3.1.0",  # Reserved for future rich Excel formatting
]

ui = [
    "streamlit>=1.36",  # Phase 4 dashboard; >=1.36 for st.navigation/st.Page (pip install data-quality-toolkit[ui])
]

stats = [
    "scipy>=1.11,<2.0",  # Statistical drift detection (KS / chi-square); >=1.11 for attribute-style chi2_contingency result
]

duckdb = [
    "duckdb>=1.0.0",  # SQLite->DuckDB drift-history mirror: dqt drift-history export-duckdb
]

# Optional faster manifest serialization backends. Both are selected by existing
# settings and neither is ever required: SERDE_IMPL defaults to "pydantic" and
# JSON_WRITER defaults to "json", which use pydantic + stdlib json only.
serde = [
    "msgspec>=0.20.0",  # Manifest serializer backend: SERDE_IMPL=msgspec
    "orjson>=3.11.7",  # Manifest JSON writer backend: JSON_WRITER=orjson
]

storylens-ai = [
    "transformers>=5.0.0,<6.0.0",  # Optional local StoryLens AI backend (Category A only); primary model: HuggingFaceTB/SmolLM2-135M-Instruct
    "torch>=2.12.0",               # Required by transformers v5; CPU-only torch may require PyTorch CPU index (see install docs)
]

[project.urls]
Homepage = "https://github.com/asamili/data-quality-toolkit"
Repository = "https://github.com/asamili/data-quality-toolkit"
"Bug Tracker" = "https://github.com/asamili/data-quality-toolkit/issues"
Changelog = "https://github.com/asamili/data-quality-toolkit/blob/main/CHANGELOG.md"

# CLI entrypoint
[project.scripts]
dqt = "data_quality_toolkit.adapters.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
include = ["data_quality_toolkit*"]

[tool.setuptools.package-data]
data_quality_toolkit = [
    "adapters/exporters/bi/templates/*",
    "py.typed"
]

# ===== Tool Configurations =====

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/**/*.ipynb", "dist/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "W", "C90", "S"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "B905",   # zip() without explicit strict=
    "B018",   # Found useless expression
    "N805",   # First argument of method should be self
    "S101",   # Use of assert detected
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "S101", "S108"]  # Allow asserts, expressions, and /tmp paths in tests
"scripts/*" = ["S101"]  # Allow asserts in scripts

# mccabe: give the already-selected C90 rule an enforced ceiling
[tool.ruff.lint.mccabe]
max-complexity = 10

# Black formatter
[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | \.mypy_cache
)/
'''

# isort
[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["data_quality_toolkit"]

# MyPy
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_optional = true
files = ["src", "tests"]
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "pandas.*",
    "numpy.*",
    "jinja2.*",
    "yaml.*",
    "openpyxl.*",
    "scipy.*",
    "matplotlib",
    "matplotlib.*",
    "duckdb",
    "duckdb.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["orjson", "orjson.*", "msgspec", "msgspec.*"]
ignore_missing_imports = true


# Coverage
[tool.coverage.run]
source = ["src/data_quality_toolkit"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/templates/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ===== Import-linter: Architecture Boundary Contracts =====
# Run with: lint-imports --config pyproject.toml
# These contracts encode the Option B layered architecture.
# Restructure complete (001C-A through 001C-G). All paths reflect the final layout.
#
# Layer model (final — Option B pragmatic layering, not strict hexagonal):
#   domain:       domain.profiling, domain.assessment, domain.semantics, domain.statistics
#   application:  application.workflow  (api.py stays at package root per H4)
#   adapters:     adapters.loaders, adapters.exporters, adapters.storage, adapters.ui, adapters.cli
#   shared:       shared, utils  (cross-cutting, stays at package root)

[tool.importlinter]
root_packages = ["data_quality_toolkit"]
# External packages are graphed so presentation-framework containment
# (Streamlit) can be enforced statically, not merely by convention.
include_external_packages = true

[[tool.importlinter.contracts]]
# Whole-package rule: source and forbidden lists are whole packages rather than an enumerated
# subset of subpackages. The enumerated form silently exempted every package
# added after it was written (adapters.reports, adapters.notifications,
# application.explanation, application.monitoring, lineage), so the rule decayed
# as the repository grew. Naming the package roots makes the contract
# self-maintaining: a new subpackage on either side is covered on creation.
name = "Domain must not import adapters, application, lineage, or the public API seam"
type = "forbidden"
source_modules = [
    "data_quality_toolkit.domain",
]
forbidden_modules = [
    "data_quality_toolkit.adapters",
    "data_quality_toolkit.application",
    "data_quality_toolkit.lineage",
    "data_quality_toolkit.api",
]

[[tool.importlinter.contracts]]
# Whole-package rule: widened from an enumerated subpackage list to the package roots, for the
# same decay reason recorded on the domain contract above. shared/ and utils/
# stay the cross-cutting kernel: they may depend on stdlib and third-party
# packages freely, but on no module that owns business meaning.
name = "Shared kernel must not import any business module"
type = "forbidden"
source_modules = [
    "data_quality_toolkit.shared",
    "data_quality_toolkit.utils",
]
forbidden_modules = [
    "data_quality_toolkit.domain",
    "data_quality_toolkit.adapters",
    "data_quality_toolkit.application",
    "data_quality_toolkit.lineage",
    "data_quality_toolkit.api",
]

[[tool.importlinter.contracts]]
# DOCUMENTED EXCEPTION:
# workflow/pipeline.py (application layer) imports loaders, exporters, and storage
# (adapter layer) directly. In strict hexagonal architecture this coupling would be
# inverted via port interfaces. Option B is pragmatic layering, not strict hexagonal.
# This coupling is intentional and documented here — NOT silently permitted.
# Resolving it (introducing port interfaces) is explicitly Option C scope.
name = "Application-to-adapter coupling (H1 documented exception — Option B pragmatic layering)"
type = "forbidden"
source_modules = [
    "data_quality_toolkit.domain.assessment",
    "data_quality_toolkit.domain.profiling",
    "data_quality_toolkit.domain.semantics",
    "data_quality_toolkit.domain.statistics",
    "data_quality_toolkit.shared",
    "data_quality_toolkit.utils",
]
forbidden_modules = [
    "data_quality_toolkit.adapters.cli",
    "data_quality_toolkit.adapters.ui",
]
ignore_imports = [
    # H1: pipeline orchestration (application) calls adapter-layer IO directly
    "data_quality_toolkit.application.workflow.pipeline -> data_quality_toolkit.adapters.loaders.file.csv_loader",
    "data_quality_toolkit.application.workflow.pipeline -> data_quality_toolkit.adapters.exporters.bi_star_schema",
    "data_quality_toolkit.application.workflow.pipeline -> data_quality_toolkit.adapters.exporters.filesystem.csv_exporter",
    "data_quality_toolkit.application.workflow.pipeline -> data_quality_toolkit.adapters.exporters.issue_export",
    "data_quality_toolkit.application.workflow.pipeline -> data_quality_toolkit.adapters.storage.connection",
    "data_quality_toolkit.application.workflow.pipeline -> data_quality_toolkit.adapters.storage.schema",
    "data_quality_toolkit.application.workflow.pipeline -> data_quality_toolkit.adapters.storage.writer",
    "data_quality_toolkit.application.workflow.pipeline -> data_quality_toolkit.adapters.storage.jsonl",
    "data_quality_toolkit.application.workflow.compare -> data_quality_toolkit.adapters.storage.connection",
    "data_quality_toolkit.application.workflow.compare -> data_quality_toolkit.adapters.storage.reader",
    # api.py (application seam at root) calls adapter-layer loaders for dataset_id
    "data_quality_toolkit.api -> data_quality_toolkit.adapters.loaders.file.csv_loader",
]

[[tool.importlinter.contracts]]
# ARCHITECTURE DECISION: lineage/ kept as top-level cross-cutting package.
# Prophylactic boundary: lineage must not import adapter, application, or delivery layers.
# Only shared kernel (shared, utils) and self-internal imports are permitted.
name = "Lineage package must not import adapters, application, or delivery layers"
type = "forbidden"
source_modules = [
    "data_quality_toolkit.lineage",
]
forbidden_modules = [
    "data_quality_toolkit.adapters.loaders",
    "data_quality_toolkit.adapters.exporters",
    "data_quality_toolkit.adapters.storage",
    "data_quality_toolkit.adapters.cli",
    "data_quality_toolkit.adapters.ui",
    "data_quality_toolkit.adapters.reports",
    "data_quality_toolkit.adapters.notifications",
    "data_quality_toolkit.application.workflow",
    "data_quality_toolkit.application.monitoring",
    "data_quality_toolkit.api",
]

[[tool.importlinter.contracts]]
# Lock StoryLens optional AI non-exposure by import-linter contract.
# Public API and CLI command modules must not import StoryLens AI internals.
# Non-exposure was previously held only by convention + runtime tests;
# this contract makes it a static, machine-checked boundary.
# UI pages/services may still use the approved default-off fallback path
# (adapters.ui is not in source_modules).
#
# Intentional transitive exception:
#   adapters.cli.utils.streamlit_launcher → adapters.ui.app
#   The CLI `ui` command uses streamlit_launcher as a subprocess launcher to
#   start the Streamlit dashboard. The dashboard includes data_overview.py
#   which uses the approved default-off AI fallback (try_explain). The
#   streamlit_launcher is a launch helper, not a CLI business handler.
#   We suppress only this single edge so that direct CLI imports of AI
#   symbols remain forbidden.
name = "Public API and CLI must not import StoryLens optional AI internals"
type = "forbidden"
source_modules = [
    "data_quality_toolkit.api",
    "data_quality_toolkit.adapters.cli",
]
forbidden_modules = [
    "data_quality_toolkit.application.explanation.ai_adapter",
    "data_quality_toolkit.application.explanation.ai_narrator",
]
ignore_imports = [
    "data_quality_toolkit.adapters.cli.utils.streamlit_launcher -> data_quality_toolkit.adapters.ui.app",
]

[[tool.importlinter.contracts]]
# Static managed-export containment: managed Export/API siblings accept
# only the shared VerifiedManagedExportSource; API and workflow layers must never
# import the UI layer to obtain trust or provenance types.
name = "Managed activation containment: API and workflow must not import the UI layer"
type = "forbidden"
source_modules = [
    "data_quality_toolkit.api",
    "data_quality_toolkit.application.workflow",
]
forbidden_modules = [
    "data_quality_toolkit.adapters.ui",
]

# ===== Import/layer boundary hardening (whole-package contracts) =====
# The three contracts below close enforcement gaps that were previously held by
# module docstrings and review convention only. Each was validated against the
# current import graph before being added, and none carries an ignore list.

[[tool.importlinter.contracts]]
# Rule 1. The UI tier is layered even though it lives under one package.
# adapters/ui/services is this repository's de-facto application/use-case tier:
# it owns coordination and state transitions and is deliberately kept in place
# (see the module docstring on adapters/ui/services/__init__.py). Presentation
# (app -> pages -> components) may depend on it; it must never depend upward on
# presentation. Only these four modules are layered. adapters.ui.state is left
# unlayered on purpose: services and state legitimately reference each other
# across the session-state seam, and forcing them into this order would be a
# false constraint.
name = "UI presentation must depend on the ui/services application tier, never the reverse"
type = "layers"
layers = [
    "data_quality_toolkit.adapters.ui.app",
    "data_quality_toolkit.adapters.ui.pages",
    "data_quality_toolkit.adapters.ui.components",
    "data_quality_toolkit.adapters.ui.services",
]

[[tool.importlinter.contracts]]
# Rule 2. Streamlit is a presentation framework, so only the render surface
# (adapters.ui.app, adapters.ui.pages) and the CLI's subprocess launcher
# (adapters.cli.utils.streamlit_launcher, which starts the dashboard rather than
# rendering it) may import it. Every layer below presentation -- including the
# ui/services application tier, whose docstrings have long declared it
# "Streamlit-free" -- must stay framework-neutral, so the same behaviour stays
# reachable from UI, CLI and API alike. This forbids one presentation framework,
# not third-party dependencies in general.
name = "Streamlit must not reach below the presentation layer"
type = "forbidden"
source_modules = [
    "data_quality_toolkit.domain",
    "data_quality_toolkit.shared",
    "data_quality_toolkit.utils",
    "data_quality_toolkit.application",
    "data_quality_toolkit.lineage",
    "data_quality_toolkit.api",
    "data_quality_toolkit.adapters.loaders",
    "data_quality_toolkit.adapters.exporters",
    "data_quality_toolkit.adapters.storage",
    "data_quality_toolkit.adapters.reports",
    "data_quality_toolkit.adapters.notifications",
    "data_quality_toolkit.adapters.ui.services",
    "data_quality_toolkit.adapters.ui.components",
    "data_quality_toolkit.adapters.ui.state",
]
forbidden_modules = [
    "streamlit",
]

[[tool.importlinter.contracts]]
# Rule 3. Backend layers must not import a delivery surface to reuse its
# behaviour. The pre-existing managed-activation contract already pinned
# api + application.workflow -> adapters.ui for the managed-trust finding; this
# generalises the same direction to every backend package and to both delivery
# surfaces, so genuinely multi-surface behaviour has to live below presentation
# instead of being borrowed from it. The overlap with the managed-containment contract is
# deliberate: that contract stays as the named record of its own finding.
name = "Backend layers must not import the CLI or UI delivery surfaces"
type = "forbidden"
source_modules = [
    "data_quality_toolkit.application",
    "data_quality_toolkit.api",
    "data_quality_toolkit.adapters.loaders",
    "data_quality_toolkit.adapters.exporters",
    "data_quality_toolkit.adapters.storage",
    "data_quality_toolkit.adapters.reports",
    "data_quality_toolkit.adapters.notifications",
]
forbidden_modules = [
    "data_quality_toolkit.adapters.cli",
    "data_quality_toolkit.adapters.ui",
]
